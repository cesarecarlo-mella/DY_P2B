kinematics:
  # as in FORM: p1, p2, r1 incoming, q = -p1-p2-r1, q^2 = m2 (legs 1 = p1, 2 = p2, 3 = q, 4 = r1)
  incoming_momenta: [p1, p2, q, r1]
  outgoing_momenta: []
  momentum_conservation: [q, -p1-p2-r1]
  kinematic_invariants:
    - [s,  2]
    - [t,  2]
    - [m2, 2]
  scalarproduct_rules:
    - [[p1,p1], 0]
    - [[p2,p2], 0]
    - [[r1,r1], 0]
    - [[p1+p2, p1+p2], s]
    - [[p1+r1, p1+r1], t]
    - [[p2+r1, p2+r1], m2-s-t]
  symbol_to_replace_by_one: m2
