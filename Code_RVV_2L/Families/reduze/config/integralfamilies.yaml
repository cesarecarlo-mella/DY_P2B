integralfamilies:
  # two-loop four-point families with one off-shell leg, PL and NPL of Hjet2L (Code/Scripts/Templates/common.py),
  # there with outgoing massless p1, p2, p3; here all legs incoming (p1, p2, r1, q = -p1-p2-r1), so their
  # p1, p2, p3 -> -p1, -p2, -r1 (e.g. k1-p1 -> k1+p1, k1+p3 -> k1-r1). Crossings: generated by Reduze.
  - name: "PL"
    loop_momenta: [k1, k2]
    propagators:
      - [ "k1",          0 ]
      - [ "k2",          0 ]
      - [ "k1-k2",       0 ]
      - [ "k1+p1",       0 ]
      - [ "k2+p1",       0 ]
      - [ "k1+p1+p2",    0 ]
      - [ "k2+p1+p2",    0 ]
      - [ "k1+p1+p2+r1", 0 ]
      - [ "k2+p1+p2+r1", 0 ]
  - name: "NPL"
    loop_momenta: [k1, k2]
    propagators:
      - [ "k1",          0 ]
      - [ "k2",          0 ]
      - [ "k1+p1",       0 ]
      - [ "k2+p1",       0 ]
      - [ "k1-r1",       0 ]
      - [ "k2-r1",       0 ]
      - [ "k1-p2-r1",    0 ]
      - [ "k1-k2",       0 ]
      - [ "k1-k2-p2",    0 ]
