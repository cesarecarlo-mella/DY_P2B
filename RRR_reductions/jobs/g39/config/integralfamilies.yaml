integralfamilies:

  - name: "topo757"
    loop_momenta: [r1, r2, r3]
    propagators:
     - [ "r1", 0]
     - [ "r2", 0]
     - [ "r3", 0]
     - [ "p1+p2+r1+r2+r3", m2]
     - { bilinear: [ ["-p1-p2-r1-r2-r3", "-p1+u*p2"], 0 ] }
     - [ "p2+r1", 0]   # DD7
     - [ "p2+r2", 0]   # DD9
     - [ "p2+r1+r2", 0]   # DD16
     - [ "p2+r1+r3", 0]   # DD18
     - [ "p2+r1+r2+r3", 0]   # DD23
     - [ "p1+p2+r1+r2", 0]   # DD27
     - [ "p1+p2+r1+r3", 0]   # DD28
    cut_propagators: [1, 2, 3, 4, 5]

