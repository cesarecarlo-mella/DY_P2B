     - [ "p1+r1", 0]   # DD6
     - [ "p2+r2", 0]   # DD9
     - [ "r1+r2", 0]   # DD12
     - [ "p1+r1+r2", 0]   # DD15
     - [ "p2+r1+r2", 0]   # DD16
     - [ "p2+r2+r3", 0]   # DD20
     - [ "p1+r1+r2+r3", 0]   # DD22
    cut_propagators: [1, 2, 3, 4, 5]

  - name: "topo508"
    loop_momenta: [r1, r2, r3]
    propagators:
     - [ "r1", 0]
     - [ "r2", 0]
     - [ "r3", 0]
     - [ "p1+p2+r1+r2+r3", m2]
     - { bilinear: [ ["-p1-p2-r1-r2-r3", "-p1+u*p2"], 0 ] }
     - [ "p1+r1", 0]   # DD6
     - [ "p2+r2", 0]   # DD9
     - [ "r2+r3", 0]   # DD13
     - [ "p1+r1+r2", 0]   # DD15
     - [ "p2+r1+r2", 0]   # DD16
     - [ "p1+r1+r2+r3", 0]   # DD22
     - [ "p1+p2+r1+r2", 0]   # DD27
    cut_propagators: [1, 2, 3, 4, 5]
