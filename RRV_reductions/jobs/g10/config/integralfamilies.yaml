     - [ "p1+r1+r2", 0]   # DD9 (RR)
     - [ "k1", 0]   # DD14 (loop)
     - [ "k1+p2", 0]   # DD16 (loop)
     - [ "k1+p2+r1", 0]   # DD20 (loop)
     - [ "k1+p1+p2+r1", 0]   # DD21 (loop)
     - [ "k1+p1+p2+r1+r2", 0]   # DD29 (loop)
    cut_propagators: [1, 2, 3, 4]

