integralfamilies:

  - name: "topo10"
    loop_momenta: [r1, r2, k1]
    propagators:
     - [ "r1", 0]
     - [ "r2", 0]
     - [ "p1+p2+r1+r2", m2]
     - { bilinear: [ ["-p1-p2-r1-r2", "-p1+u*p2"], 0 ] }
     - [ "p2+r2", 0]   # DD8 (RR)
     - [ "p1+r1+r2", 0]   # DD9 (RR)
     - [ "p1+p2+r2", 0]   # DD13 (RR)
     - [ "k1", 0]   # DD14 (loop)
     - [ "k1+p2", 0]   # DD16 (loop)
     - [ "k1+p2+r2", 0]   # DD24 (loop)
     - [ "k1+p1+p2+r2", 0]   # DD25 (loop)
     - [ "k1+p1+p2+r1+r2", 0]   # DD29 (loop)
    cut_propagators: [1, 2, 3, 4]

