# group g20: RRV families 77 (Code_RRV/integrals/all; make_jobs.py)
jobs:
 - reduce_sectors:
    conditional: true
    reduce:
     - {topologies: [topo77], sectors: [2047], r: 11, s: 5}
    select_integrals:
      select_mandatory_list:
        - [topo77, toreduce/topo77.txt]
    run_symmetries: true
    run_initiate: true
    run_triangular: false
    run_firefly: true
    run_back_substitution: false
 - kira2math:
    target:
       - [topo77, toreduce/topo77.txt]
    reconstruct_mass: false
 - kira2form:
    target:
       - [topo77, toreduce/topo77.txt]
    reconstruct_mass: false
