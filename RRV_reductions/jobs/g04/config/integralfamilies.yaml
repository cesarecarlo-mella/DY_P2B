integralfamilies:

  - name: "topo4"
    loop_momenta: [r1, r2, k1]
    propagators:
     - [ "r1", 0]
     - [ "r2", 0]
     - [ "p1+p2+r1+r2", m2]
     - { bilinear: [ ["-p1-p2-r1-r2", "-p1+u*p2"], 0 ] }
     - [ "p1+r1", 0]   # DD5 (RR)
     - [ "p2+r1", 0]   # DD6 (RR)
     - [ "p1+r1+r2", 0]   # DD9 (RR)
     - [ "k1", 0]   # DD14 (loop)
     - [ "k1+p1", 0]   # DD15 (loop)
     - [ "k1+p1+r2", 0]   # DD23 (loop)
     - [ "k1+p1+r1+r2", 0]   # DD27 (loop)
     - [ "k1+p1+p2+r1+r2", 0]   # DD29 (loop)
    cut_propagators: [1, 2, 3, 4]

